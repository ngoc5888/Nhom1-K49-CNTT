{% extends "base.html" %}

{% block title %}Quên mật khẩu - University LMS{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden">
        <!-- Header Banner -->
        <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 p-8 text-center text-white relative">
            <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 items-center justify-center shadow-lg shadow-pink-500/30 text-white text-2xl font-bold mb-2">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-extrabold tracking-tight">Quên Mật khẩu</h2>
            <p class="text-xs text-indigo-200 mt-1">Cấp lại mật khẩu tạm thời cho tài khoản</p>
        </div>

        <div class="p-8 space-y-6">
            <form method="POST" action="{{ url_for('auth_bp.forgot_password') }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Địa chỉ Email tài khoản</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                        <input type="email" name="email" required placeholder="email@example.com" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:bg-white focus:border-transparent transition-all">
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1.5">Mật khẩu tạm thời mặc định là <code class="font-mono text-purple-600 bg-purple-50 px-1 py-0.5 rounded font-bold">demo123</code></p>
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-700 hover:to-pink-600 text-white font-bold rounded-xl shadow-lg shadow-pink-500/25 transition-all duration-200 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                    <span>Gửi yêu cầu khôi phục</span>
                </button>
            </form>

            <div class="text-center pt-4 border-t border-slate-100">
                <a href="{{ url_for('auth_bp.login') }}" class="inline-flex items-center text-xs font-bold text-purple-600 hover:text-purple-700 transition-colors space-x-1.5">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Quay lại Đăng nhập</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
