{% extends "base.html" %}

{% block title %}Quên mật khẩu - University LMS{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-8 space-y-6">
    <div class="text-center space-y-2">
        <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Quên Mật khẩu</h2>
        <p class="text-sm text-slate-500">Nhập email để cấp lại mật khẩu tạm thời</p>
    </div>

    <form method="POST" action="{{ url_for('auth_bp.forgot_password') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Địa chỉ Email</label>
            <input type="email" name="email" required placeholder="email@example.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:bg-white transition-all">
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-700 hover:to-pink-600 text-white font-semibold rounded-xl shadow-lg shadow-pink-500/25 transition-all duration-200">
            Gửi yêu cầu khôi phục
        </button>
    </form>

    <div class="text-center text-sm text-slate-500 pt-2 border-t border-slate-100">
        <a href="{{ url_for('auth_bp.login') }}" class="font-semibold text-purple-600 hover:text-purple-700"> Quay lại Đăng nhập</a>
    </div>
</div>
{% endblock %}
