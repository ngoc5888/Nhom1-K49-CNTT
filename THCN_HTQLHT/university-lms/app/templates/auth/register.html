{% extends "base.html" %}

{% block title %}Đăng ký tài khoản - University LMS{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-8 space-y-6">
    <div class="text-center space-y-2">
        <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Đăng ký Tài khoản</h2>
        <p class="text-sm text-slate-500">Tạo tài khoản học tập LMS Đại học</p>
    </div>

    <form method="POST" action="{{ url_for('auth_bp.register') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Họ và Tên</label>
            <input type="text" name="full_name" required placeholder="Nguyễn Văn A" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:bg-white transition-all">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email trường</label>
            <input type="email" name="email" required placeholder="sv@example.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:bg-white transition-all">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Số điện thoại</label>
            <input type="text" name="phone" placeholder="0901234567" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:bg-white transition-all">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Vai trò</label>
            <select name="role" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:bg-white transition-all">
                <option value="student">Sinh viên</option>
                <option value="teacher">Giảng viên</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:bg-white transition-all">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Xác nhận mật khẩu</label>
            <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:bg-white transition-all">
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-700 hover:to-pink-600 text-white font-semibold rounded-xl shadow-lg shadow-pink-500/25 transition-all duration-200">
            Đăng ký ngay
        </button>
    </form>

    <div class="text-center text-sm text-slate-500 pt-2 border-t border-slate-100">
        Đã có tài khoản? <a href="{{ url_for('auth_bp.login') }}" class="font-semibold text-purple-600 hover:text-purple-700">Đăng nhập</a>
    </div>
</div>
{% endblock %}
